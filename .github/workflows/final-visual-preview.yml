name: One-time final visual preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-visual-preview.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:local_postgres_only@127.0.0.1:5432/reformdesk
      DATABASE_URL: postgresql://reformdesk_app:reformdesk_dev_only@127.0.0.1:5432/reformdesk
      AUTH_ALLOW_REGISTRATION: 'false'
      PUBLIC_APP_ORIGIN: http://127.0.0.1:3187
      NEXT_PUBLIC_SITE_URL: https://www.studiotasker.com
      PADDLE_ENV: sandbox
      NEXT_PUBLIC_PADDLE_ENV: sandbox
      PADDLE_API_KEY: ci_only_mock_paddle_key
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: test_ci_only_token_123456
      PADDLE_MONTHLY_PRICE_ID: pri_aaaaaaaaaaaaaaaaaaaaaaaaaa
      PADDLE_ANNUAL_PRICE_ID: pri_bbbbbbbbbbbbbbbbbbbbbbbbbb
      PADDLE_WEBHOOK_SECRET: ci_only_mock_webhook_secret_not_for_production
      BILLING_ALLOW_LOCAL_TEST: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reformdesk
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_postgres_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reformdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Initialize local database
        run: npm run db:setup:local
      - name: Build final app
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm start -- -p 3187 > /tmp/studiotasker-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3187/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/studiotasker-preview.log
          exit 1
      - name: Capture final screenshots
        run: |
          mkdir -p final-preview
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100},deviceScaleFactor:1});
          await page.goto("http://127.0.0.1:3187/",{waitUntil:"networkidle"});
          await page.screenshot({path:"final-preview/01-home-top.png",fullPage:false});
          for(const [selector,name] of [
            [".ed-studio-types","02-studio-types.png"],
            [".ed-product-tour","03-product-tour.png"],
            [".ed-why","04-why-studiotasker.png"],
            [".ed-onboarding","05-self-serve-onboarding.png"]
          ]){
            const el=page.locator(selector).first();
            await el.scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
            await el.screenshot({path:"final-preview/"+name});
          }
          await page.goto("http://127.0.0.1:3187/start",{waitUntil:"networkidle"});
          await page.screenshot({path:"final-preview/06-start.png",fullPage:false});
          await page.goto("http://127.0.0.1:3187/checkout",{waitUntil:"networkidle"});
          await page.screenshot({path:"final-preview/07-checkout.png",fullPage:false});
          await page.goto("http://127.0.0.1:3187/app-demo",{waitUntil:"networkidle"});
          await page.screenshot({path:"final-preview/08-demo.png",fullPage:false});
          await browser.close();
          EOF
          node /tmp/capture.mjs
      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: studiotasker-final-preview
          path: final-preview
          retention-days: 1
