name: Build and CRM regression
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reformdesk
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_postgres_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reformdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:local_postgres_only@127.0.0.1:5432/reformdesk
      DATABASE_URL: postgresql://reformdesk_app:reformdesk_dev_only@127.0.0.1:5432/reformdesk
      AUTH_ALLOW_REGISTRATION: 'false'
      PUBLIC_APP_ORIGIN: http://127.0.0.1:3187
      PADDLE_ENV: sandbox
      PADDLE_API_KEY: ci_only_mock_paddle_key
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: test_ci_only_token_123456
      PADDLE_MONTHLY_PRICE_ID: pri_aaaaaaaaaaaaaaaaaaaaaaaaaa
      PADDLE_ANNUAL_PRICE_ID: pri_bbbbbbbbbbbbbbbbbbbbbbbbbb
      PADDLE_WEBHOOK_SECRET: ci_only_mock_webhook_secret_not_for_production
      BILLING_ALLOW_LOCAL_TEST: 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Verify hardened Docker runtime tools and patched zlib
        run: |
          docker build --pull --target runtime-tools -t studiotasker-runtime-tools .
          docker run --rm --entrypoint sh studiotasker-runtime-tools -ec '
            command -v node && command -v pg_dump && command -v rclone
            ! command -v npm
            ! command -v npx
            test ! -e /usr/local/lib/node_modules/npm
            zlib_version="$(apk info -v zlib | sed -n "s/^zlib-//p")"
            test -n "$zlib_version"
            test "$(apk version -t "$zlib_version" "1.3.2-r1")" != "<"
            echo "Verified patched zlib: $zlib_version; npm/npx absent in runtime"
          '
      - name: Initialize isolated PostgreSQL test database
        run: npm run db:setup:local
      - name: Test reviewed studio erasure on isolated database
        run: npm run test:closure
      - name: Smoke test supported Nodemailer delivery API
        run: npm run test:mail
      - name: Test authentication cryptography
        run: npm run test:auth
      - name: Test database tenant isolation
        run: npm run test:db
      - name: Run CRM regression checks
        run: npm run test:crm
      - name: Test CSV parser and migration file guards
        run: npm run test:csv
      - name: Test role-based app demo authentication
        run: npm run test:demo-auth
      - name: Test Excel import/export and validation
        run: npm run test:excel
      - name: Test credit corrections and Undo/Redo
        run: npm run test:history
      - name: Test extended CRM forms, repeat classes and task outcomes
        run: npm run test:workflows
      - name: Test encrypted database backup format
        run: npm run test:backup
      - name: Restore encrypted real PostgreSQL snapshot and compare RLS, data and constraints
        run: npm run test:restore:e2e
      - name: Check editorial copy
        run: npm run test:copy
      - name: Test PostgreSQL CLI connection settings
        run: npm run test:pg-env
      - name: Test systemd maintenance templates
        run: npm run test:ops
      - name: Test off-site backup path guards
        run: npm run test:offsite
      - name: Test basic accessibility and mobile layout guards
        run: npm run test:ui
      - name: Test technical SEO invariants
        run: npm run test:seo
      - name: Test IANA timezone and DST handling
        run: npm run test:timezone
      - name: Test commercial registration release gate
        run: npm run test:release
      - name: Compile production build
        run: npm run build
      - name: Test production HTML and SEO HTTP behavior
        run: npm run test:seo:http
      - name: Test live HTTP auth and tenant access
        run: npm run test:api
      - name: Real Chromium mobile and typography smoke
        run: npm run test:browser
