name: Final visual preview v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-visual-preview-v2.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:local_postgres_only@127.0.0.1:5432/reformdesk
      DATABASE_URL: postgresql://reformdesk_app:reformdesk_dev_only@127.0.0.1:5432/reformdesk
      AUTH_ALLOW_REGISTRATION: 'false'
      PUBLIC_APP_ORIGIN: http://127.0.0.1:3187
      NEXT_PUBLIC_SITE_URL: https://www.studiotasker.com
      PADDLE_ENV: sandbox
      NEXT_PUBLIC_PADDLE_ENV: sandbox
      PADDLE_API_KEY: ci_only_mock_paddle_key
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: test_ci_only_token_123456
      PADDLE_MONTHLY_PRICE_ID: pri_aaaaaaaaaaaaaaaaaaaaaaaaaa
      PADDLE_ANNUAL_PRICE_ID: pri_bbbbbbbbbbbbbbbbbbbbbbbbbb
      PADDLE_WEBHOOK_SECRET: ci_only_mock_webhook_secret_not_for_production
      BILLING_ALLOW_LOCAL_TEST: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reformdesk
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_postgres_only
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d reformdesk" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:setup:local
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start final app
        run: |
          npm start -- -p 3187 > /tmp/studiotasker-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3187/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/studiotasker-preview.log
          exit 1
      - name: Capture final screens
        run: |
          mkdir -p final-preview
          node scripts/capture-final-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: studiotasker-final-preview-v2
          path: final-preview
          retention-days: 1
