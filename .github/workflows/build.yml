name: Build and CRM regression
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run CRM regression checks
        run: npm run test:crm
      - name: Test Excel import/export and validation
        run: npm run test:excel
      - name: Compile production build
        run: npm run build
