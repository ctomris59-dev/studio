name: Temporary verified Next.js security lock refresh
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  refresh-lock:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/studio-operations-upgrades' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 7
    steps:
      - name: Checkout this exact internal feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/studio-operations-upgrades
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh vulnerable Next.js and pinned related tooling
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact next@15.5.28
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact --save-dev eslint-config-next@15.5.28 @next/eslint-plugin-next@15.5.28
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='15.5.28'||p.devDependencies['eslint-config-next']!=='15.5.28'||p.devDependencies['@next/eslint-plugin-next']!=='15.5.28')process.exit(1)"
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Save verified lockfile to feature branch only
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Security lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git commit -m "fix(security): patch Next.js RCE and DoS to 15.5.28"
          git push origin HEAD:feature/studio-operations-upgrades
