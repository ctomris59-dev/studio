name: Paddle Sandbox Catalog Seed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paddle-catalog-seed.yml"
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create StudioTasker catalog in Paddle Sandbox
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: npm run paddle:seed:sandbox
