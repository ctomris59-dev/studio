services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_only
      POSTGRES_DB: reformdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reformdesk_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reformdesk"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  reformdesk_dev_pg:
